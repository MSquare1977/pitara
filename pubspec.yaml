name: pitara
description: Encrypted personal document vault — proof of concept.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

  intl: ^0.19.0
  local_auth: ^2.3.0
  flutter_reorderable_grid_view: ^5.6.0
  shared_preferences: ^2.3.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^12.1.2
  pdfx: ^2.6.0
  share_plus: ^13.3.1
  open_filex: ^4.7.0
  google_sign_in: ^7.2.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  color: "#14213D"
  image: assets/icon/splash_branding.png
  android_12:
    color: "#14213D"
    image: assets/icon/splash_branding.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#14213D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true